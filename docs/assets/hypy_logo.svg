<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-label="hypy logo">
  <title>hypy</title>
  <desc>Earthquake localization: a map pin with a seismograph waveform over radiating seismic waves.</desc>

  <!-- Background -->
  <rect x="0" y="0" width="512" height="512" rx="96" ry="96" fill="#0E7C86"/>

  <!-- Seismic ripples (drawn first, pin sits on top) -->
  <g fill="none" stroke="#FFFFFF" stroke-width="11" stroke-linecap="round">
    <ellipse cx="256" cy="420" rx="132" ry="42"/>
    <ellipse cx="256" cy="420" rx="80" ry="25"/>
  </g>

  <!-- Location pin (teardrop) -->
  <path fill="#FFFFFF"
        d="M256 40
           C198 40 151 87 151 145
           C151 224 256 370 256 370
           C256 370 361 224 361 145
           C361 87 314 40 256 40 Z"/>

  <!-- Inner cut-out so the waveform reads clearly -->
  <circle cx="256" cy="145" r="66" fill="#0E7C86"/>

  <!-- Seismograph waveform -->
  <polyline fill="none" stroke="#FFFFFF" stroke-width="9"
            stroke-linecap="round" stroke-linejoin="round"
            points="196,145 222,145 234,129 247,162 256,98 266,180 278,124 290,145 316,145"/>
</svg>
