[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pyrefly]
project-includes = ["**/*"]
project-excludes = [
    "**/node_modules",
    "**/__pycache__",
    "**/*venv/**/*",
]

[project]
name = "hypy"
version = "1.2.2"
description = "A Python package for locating seismic events based on seismic arrivals."
authors = [{ name = "Yevhenii Antcating"}]
license = { text = "MIT" }
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy==1.26.4",
    "obspy>=1.2",
    "scipy>=1.7",
    "numba>=0.61",
    "matplotlib>=3.10.8",
    "cartopy>=0.25.0",
    "pandas>=2.0",
]

[project.optional-dependencies]
# Extra for development and testing

[dependency-groups]
# Dev group
dev = [
    "austin-dist>=4.0.0",
    "hatchling>=1.29.0",
    "pre-commit>=4.5.1",
    "pytest>=9.0.2",
    "pytest-cov>=7.1.0",
    "pytest-ruff>=0.5",
    "sphinx>=9.0.4",
    "sphinx-rtd-theme>=3.1.0",
]

# Property-based / fuzz testing group
fuzz = [
    "hypothesis>=6.100",
]

# 3D support group
3d = [
    "netcdf4>=1.7.3",
    "nllgrid>=1.6",
    "pyekfmm>=0.0.9.0",
]

# 1D fast marching support group
fmm = [
    "scikit-fmm>=2025.6.23",
]
# 1D pyrocko support group
pyrocko = [
    "pyrocko>=2025.12.4",
]

[tool.hatch.build.targets.wheel]
packages = ["hypy", "examples"]
exclude = [
    "test_artifacts/**"
]
[tool.hatch.build.targets.sdist]
packages = ["hypy", "examples"]
exclude = [
    "test_artifacts/**",
    "tests/**"
]

[tool.uv.sources]
hypy = { workspace = true }

[tool.ruff]
line-length = 88
indent-width = 4

[tool.ruff.format]
docstring-code-format = true

[tool.ruff.lint]
select = ["D", "E", "F", "W", "I"]

[tool.ruff.lint.pydocstyle]
convention = "numpy"
