[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hypy"
version = "1.1.0"
description = "A Python package for locating seismic events based on seismic arrivals."
authors = [{ name = "Yevhenii Antcating"}]
license = { text = "MIT" }
readme = "README.md"
requires-python = ">=3.7"
dependencies = [
    "numpy==1.26.4",
    "obspy>=1.2",
    "scipy>=1.7"
]