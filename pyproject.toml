[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pyrefly]
project-includes = ["**/*"]
project-excludes = [
    "**/node_modules",
    "**/__pycache__",
    "**/*venv/**/*",
]

[project]
name = "hypy"
version = "1.1.0"
description = "A Python package for locating seismic events based on seismic arrivals."
authors = [{ name = "Yevhenii Antcating"}]
license = { text = "MIT" }
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy==1.26.4",
    "obspy>=1.4",
    "scipy>=1.7",
    "numba>=0.61",
    "setuptools==80.9.0"
]

[tool.hatch.build.targets.wheel]
packages = ["hypy"]
exclude = [
    "test_artifacts/**"
]
[tool.hatch.build.targets.sdist]
packages = ["hypy"]
exclude = [
    "test_artifacts/**"
]
