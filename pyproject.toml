[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pyrefly]
project-includes = ["**/*"]
project-excludes = [
    "**/node_modules",
    "**/__pycache__",
    "**/*venv/**/*",
]

[project]
name = "hypy"
version = "1.1.0"
description = "A Python package for locating seismic events based on seismic arrivals."
authors = [{ name = "Yevhenii Antcating"}]
license = { text = "MIT" }
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy==1.26.4",
    "obspy>=1.2",
    "scipy>=1.7",
    "numba>=0.61"
]

[project.optional-dependencies]
# Extra for development and testing
dev = [
    "pytest",
    "pyrocko",
    "ruff",
    "hypy",
]
# Extra that only installs pyrocko
pyrocko = ["pyrocko"]

[tool.hatch.build.targets.wheel]
packages = ["hypy"]
exclude = [
    "test_artifacts/**"
]
[tool.hatch.build.targets.sdist]
packages = ["hypy"]
exclude = [
    "test_artifacts/**"
]

[tool.uv.sources]
hypy = { workspace = true }
