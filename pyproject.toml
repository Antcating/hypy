[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pyrefly]
project-includes = ["**/*"]
project-excludes = [
    "**/node_modules",
    "**/__pycache__",
    "**/*venv/**/*",
]

[project]
name = "hypy"
version = "1.1.0"
description = "A Python package for locating seismic events based on seismic arrivals."
authors = [{ name = "Yevhenii Antcating"}]
license = { text = "MIT" }
readme = "README.md"
requires-python = ">=3.7"
dependencies = [
    "numpy==1.26.4",
    "obspy>=1.2",
    "scipy>=1.7",
    "numba>=0.61"
]

# Wheel content (what pip installs)
[tool.hatch.build.targets.wheel.force-include]
"hypy/propagation/tables/data/travel_time_tables_iasp91_taup_P_d20.0_r100.0_dz1.0_dr1.0.npz"="hypy/propagation/tables/data/travel_time_tables_iasp91_taup_P_d20.0_r100.0_dz1.0_dr1.0.npz"
"hypy/propagation/tables/data/travel_time_tables_iasp91_taup_S_d20.0_r100.0_dz1.0_dr1.0.npz"="hypy/propagation/tables/data/travel_time_tables_iasp91_taup_S_d20.0_r100.0_dz1.0_dr1.0.npz"

[tool.hatch.build.targets.sdist.force-include]
"hypy/propagation/tables/data/travel_time_tables_iasp91_taup_P_d20.0_r100.0_dz1.0_dr1.0.npz"="hypy/propagation/tables/data/travel_time_tables_iasp91_taup_P_d20.0_r100.0_dz1.0_dr1.0.npz"
"hypy/propagation/tables/data/travel_time_tables_iasp91_taup_S_d20.0_r100.0_dz1.0_dr1.0.npz"="hypy/propagation/tables/data/travel_time_tables_iasp91_taup_S_d20.0_r100.0_dz1.0_dr1.0.npz"

[tool.hatch.build.targets.wheel]
packages = ["hypy"]
exclude = [
    "test_artifacts/**"
]
[tool.hatch.build.targets.sdist]
packages = ["hypy"]
exclude = [
    "test_artifacts/**"
]
